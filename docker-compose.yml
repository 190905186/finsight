version: "3.9"
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - postgres
      - redis
    environment:
      LLM_API_BASE: ${LLM_API_BASE:?Set LLM_API_BASE in .env}
      LLM_MODEL: ${LLM_MODEL:?Set LLM_MODEL in .env}
      EMBEDDINGS_API_BASE: ${EMBEDDINGS_API_BASE:?Set EMBEDDINGS_API_BASE in .env}
      EMBEDDINGS_API_KEY: ${EMBEDDINGS_API_KEY:-}
      EMBEDDINGS_CA_CERT: /app/certs/vm02-ca.crt
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:?Set EMBEDDINGS_MODEL in .env}
      EMBEDDINGS_DIMENSIONS: ${EMBEDDINGS_DIMENSIONS:-768}
      LLM_CA_CERT: /app/certs/vm04-ca.crt
    volumes:
      - ./certs/vm04-ca.crt:/app/certs/vm04-ca.crt:ro
      - ./certs/vm02-ca.crt:/app/certs/vm02-ca.crt:ro
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: financeops
      POSTGRES_USER: financeops
      POSTGRES_PASSWORD: financeops
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  postgres_data:
