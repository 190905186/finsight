version: "3.9"
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - postgres
      - redis
      - ollama
    environment:
      LLM_API_BASE: ${LLM_API_BASE:-http://ollama:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b}
      EMBEDDINGS_API_BASE: http://ollama:11434/v1
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-nomic-embed-text}
      LLM_CA_CERT: /app/certs/vm04-ca.crt
    volumes:
      - ../../docs/vm04-ca.crt:/app/certs/vm04-ca.crt:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend
    environment:
      VITE_API_BASE: http://localhost:8000

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: financeops
      POSTGRES_USER: financeops
      POSTGRES_PASSWORD: financeops
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

  ollama:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  ollama_data:
