<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1280" viewBox="0 0 1700 1280" role="img" aria-labelledby="title description">
  <title id="title">Finsight Current Implementation Architecture</title>
  <desc id="description">Current Finsight prototype: React frontend, FastAPI APIs, a narrow consequential-action refusal gate, sequential LangGraph retrieval and report workflow, hybrid RAG over PostgreSQL pgvector and in-process BM25, configured chat and embeddings APIs, SEC and Treasury public data tools, page-level PDF ingestion, evaluation scaffolding, and explicitly noted production gaps.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081322"/>
      <stop offset="1" stop-color="#10243a"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#173553"/>
      <stop offset="1" stop-color="#102b45"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#78b8ff"/>
    </marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#55d6b0"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#e2b663"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #e8f1fb; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #adc2d8; }
      .band-title { font-size: 14px; font-weight: 700; letter-spacing: 1.2px; fill: #8eb6da; }
      .box-title { font-size: 16px; font-weight: 700; }
      .box-copy { font-size: 13px; fill: #c4d2e2; }
      .small { font-size: 12px; fill: #b7c8da; }
      .layer { fill: #0c1a2a; stroke: #28415c; stroke-width: 1.4; }
      .ui { fill: #112941; stroke: #3895d5; stroke-width: 1.5; }
      .api { fill: #132d47; stroke: #61a8ea; stroke-width: 1.5; }
      .agent { fill: #16384a; stroke: #3ab89f; stroke-width: 1.5; }
      .tool { fill: #26334b; stroke: #9c91ed; stroke-width: 1.5; }
      .data { fill: #173a35; stroke: #55c5a5; stroke-width: 1.5; }
      .source { fill: #3a3022; stroke: #d3a85d; stroke-width: 1.5; }
      .control { fill: #3a2431; stroke: #da8294; stroke-width: 1.5; }
      .hosted { fill: #302748; stroke: #bf9bff; stroke-width: 1.6; }
      .connector { fill: none; stroke: #78b8ff; stroke-width: 2; marker-end: url(#arrow); }
      .connector-teal { fill: none; stroke: #55d6b0; stroke-width: 2; marker-end: url(#arrow-teal); }
      .connector-amber { fill: none; stroke: #e2b663; stroke-width: 2; marker-end: url(#arrow-amber); }
      .dashed { stroke-dasharray: 7 6; }
    </style>
  </defs>
  <rect width="1700" height="1280" fill="url(#background)"/>
  <rect x="0" y="0" width="1700" height="100" fill="url(#header)"/>
  <text x="48" y="46" class="title">Finsight | Current Implementation Architecture</text>
  <text x="50" y="74" class="subtitle">Working prototype • configured inference endpoints • process-local state • gaps are called out, not implied as implemented</text>

  <rect x="32" y="118" width="1636" height="150" rx="18" class="layer"/>
  <text x="52" y="145" class="band-title">1  USER EXPERIENCE AND API ENTRY</text>
  <rect x="70" y="166" width="310" height="76" rx="12" class="ui"/>
  <text x="90" y="194" class="box-title">React + TypeScript frontend</text>
  <text x="90" y="218" class="box-copy">Company • FY • prompt strategy • question</text>
  <rect x="510" y="166" width="390" height="76" rx="12" class="api"/>
  <text x="530" y="194" class="box-title">FastAPI backend</text>
  <text x="530" y="218" class="box-copy">Copilot chat • direct RAG • finance • evaluation</text>
  <rect x="1040" y="166" width="570" height="76" rx="12" class="control"/>
  <text x="1060" y="194" class="box-title">Pre-workflow consequential-action refusal</text>
  <text x="1060" y="218" class="box-copy">Narrow phrase patterns; no trade/payment execution tools</text>
  <path d="M380 204 H510" class="connector"/>
  <path d="M900 204 H1040" class="connector"/>

  <rect x="32" y="288" width="1636" height="280" rx="18" class="layer"/>
  <text x="52" y="315" class="band-title">2  COPILOT CHAT / REPORT — LANGGRAPH WORKFLOW</text>
  <rect x="58" y="344" width="236" height="100" rx="12" class="agent"/>
  <text x="76" y="373" class="box-title">Planner</text>
  <text x="76" y="397" class="box-copy">Company • fiscal year</text>
  <text x="76" y="420" class="small">Report scope / retrieval filter</text>
  <rect x="326" y="344" width="236" height="100" rx="12" class="tool"/>
  <text x="344" y="373" class="box-title">RAG researcher</text>
  <text x="344" y="397" class="box-copy">Page evidence retrieval</text>
  <text x="344" y="420" class="small">Targeted searches for reports</text>
  <rect x="594" y="344" width="236" height="100" rx="12" class="tool"/>
  <text x="612" y="373" class="box-title">Public data researcher</text>
  <text x="612" y="397" class="box-copy">SEC annual facts • Treasury debt</text>
  <text x="612" y="420" class="small">Report requests only</text>
  <rect x="862" y="344" width="236" height="100" rx="12" class="agent"/>
  <text x="880" y="373" class="box-title">Fact extractor</text>
  <text x="880" y="397" class="box-copy">JSON + supporting quotes</text>
  <text x="880" y="420" class="small">One malformed-JSON repair</text>
  <rect x="1130" y="344" width="236" height="100" rx="12" class="tool"/>
  <text x="1148" y="373" class="box-title">Metric calculator</text>
  <text x="1148" y="397" class="box-copy">Validated facts • Decimal math</text>
  <text x="1148" y="420" class="small">Missing/incompatible status</text>
  <rect x="1398" y="344" width="236" height="100" rx="12" class="agent"/>
  <text x="1416" y="373" class="box-title">Analyst + citation critic</text>
  <text x="1416" y="397" class="box-copy">Synthesis • citation membership</text>
  <text x="1416" y="420" class="small">One bounded retry • recursion cap 12</text>
  <path d="M294 394 H326" class="connector"/>
  <path d="M562 394 H594" class="connector"/>
  <path d="M830 394 H862" class="connector"/>
  <path d="M1098 394 H1130" class="connector"/>
  <path d="M1366 394 H1398" class="connector"/>
  <path d="M1515 444 V480 H1248 V444" class="connector-amber dashed"/>
  <text x="1325" y="476" class="small">critic retry</text>
  <rect x="58" y="493" width="1028" height="52" rx="10" class="control"/>
  <text x="76" y="515" class="box-title">Direct RAG route is separate</text>
  <text x="76" y="535" class="small">POST /api/v1/rag/query → retrieval → prompted answer → citation-ID validation (no LangGraph)</text>
  <rect x="1110" y="493" width="524" height="52" rx="10" class="control"/>
  <text x="1128" y="515" class="box-title">Process-local conversation/checkpoint state</text>
  <text x="1128" y="535" class="small">MemorySaver + API dictionary; lost on restart, not shared across replicas</text>
  <path d="M1325 242 V278 H176 V344" class="connector"/>

  <rect x="32" y="588" width="1636" height="234" rx="18" class="layer"/>
  <text x="52" y="615" class="band-title">3  RETRIEVAL, MODEL, AND PUBLIC DATA SERVICES</text>
  <rect x="58" y="642" width="330" height="128" rx="12" class="tool"/>
  <text x="78" y="671" class="box-title">Hybrid RAG + reranker</text>
  <text x="78" y="696" class="box-copy">Dense pgvector + in-process BM25</text>
  <text x="78" y="720" class="small">Reciprocal-rank fusion • deterministic lexical rerank</text>
  <text x="78" y="746" class="small">Source snippets • page • metadata • citation IDs</text>
  <rect x="430" y="642" width="330" height="128" rx="12" class="data"/>
  <text x="450" y="671" class="box-title">PostgreSQL + pgvector</text>
  <text x="450" y="696" class="box-copy">Page chunks • vectors • document metadata</text>
  <text x="450" y="720" class="small">BM25 corpus index is loaded in backend process</text>
  <text x="450" y="746" class="small">No application Redis cache integration</text>
  <rect x="802" y="642" width="360" height="128" rx="12" class="hosted"/>
  <text x="822" y="671" class="box-title">Configured OpenAI-compatible APIs</text>
  <text x="822" y="696" class="box-copy">Chat completions • embeddings</text>
  <text x="822" y="720" class="small">Separate endpoint/model settings and TLS config</text>
  <text x="822" y="746" class="small">Model-size attestation/data approval not enforced by code</text>
  <rect x="1204" y="642" width="430" height="128" rx="12" class="tool"/>
  <text x="1224" y="671" class="box-title">Public finance MCP service</text>
  <text x="1224" y="696" class="box-copy">SEC Company Facts • U.S. Treasury Fiscal Data</text>
  <text x="1224" y="720" class="small">Read-only; SEC requires monitored-contact User-Agent</text>
  <text x="1224" y="746" class="small">Direct REST fallback when MCP transport is unavailable</text>
  <path d="M444 444 V568 H220 V642" class="connector"/>
  <path d="M388 706 H430" class="connector-teal"/>
  <path d="M760 706 H802" class="connector-teal dashed"/>
  <path d="M712 444 V570 H1419 V642" class="connector-teal"/>

  <rect x="32" y="842" width="780" height="190" rx="18" class="layer"/>
  <text x="52" y="869" class="band-title">4  OPERATOR-CONTROLLED PDF INGESTION</text>
  <rect x="58" y="896" width="205" height="100" rx="12" class="source"/>
  <text x="76" y="925" class="box-title">FinanceBench source</text>
  <text x="76" y="949" class="box-copy">84 staged PDFs</text>
  <text x="76" y="974" class="small">Explicit ingestion command</text>
  <rect x="300" y="896" width="220" height="100" rx="12" class="tool"/>
  <text x="318" y="925" class="box-title">PyMuPDF + chunking</text>
  <text x="318" y="949" class="box-copy">Page-aware text extraction</text>
  <text x="318" y="974" class="small">512/30 • 1024/30 • 1536/30</text>
  <rect x="557" y="896" width="225" height="100" rx="12" class="data"/>
  <text x="575" y="925" class="box-title">Embed + store</text>
  <text x="575" y="949" class="box-copy">Configured embeddings API</text>
  <text x="575" y="974" class="small">PostgreSQL/pgvector • no OCR</text>
  <path d="M263 946 H300" class="connector-amber"/>
  <path d="M520 946 H557" class="connector-amber"/>
  <path d="M620 896 V830 H595 V770" class="connector-teal dashed"/>
  <path d="M725 896 V830 H980 V770" class="connector-teal dashed"/>

  <rect x="842" y="842" width="826" height="190" rx="18" class="layer"/>
  <text x="862" y="869" class="band-title">5  EVALUATION AND PROCESS-LOCAL RUN HISTORY</text>
  <rect x="868" y="896" width="370" height="100" rx="12" class="control"/>
  <text x="888" y="925" class="box-title">Gold set + prompt comparison</text>
  <text x="888" y="949" class="box-copy">75 labeled FinanceBench questions + 15 refusals</text>
  <text x="888" y="974" class="small">Zero-shot • few-shot • private-CoT; dev/holdout split</text>
  <rect x="1265" y="896" width="377" height="100" rx="12" class="control"/>
  <text x="1285" y="925" class="box-title">Measured evaluation</text>
  <text x="1285" y="949" class="box-copy">Recall@k/MRR separate from answer EM/token-F1</text>
  <text x="1285" y="974" class="small">Latency reported; no cost, tracing, failure taxonomy</text>
  <path d="M1238 946 H1265" class="connector"/>

  <rect x="32" y="1052" width="1636" height="168" rx="18" class="control"/>
  <text x="52" y="1081" class="band-title">CURRENT LIMITATIONS — NOT IMPLEMENTED / NOT PRODUCTION READY</text>
  <text x="62" y="1114" class="box-copy">• 84 PDFs, below the 500–2,000-document target; no OCR or corpus-wide atomic publishing.</text>
  <text x="62" y="1143" class="box-copy">• Demo authentication; process-local conversation, checkpoint, and evaluation history; no production tenant isolation.</text>
  <text x="62" y="1172" class="box-copy">• No production rate limiting/cache, PII controls, distributed tracing, cost/tool-call metrics, or comprehensive injection tests.</text>
  <text x="62" y="1201" class="box-copy">• Citation membership is checked; semantic entailment is not. Prompt comparisons need live endpoint results before acceptance.</text>

  <text x="50" y="1256" class="small">Decision support only • gold answers are labels, not evidence • verify model attestation and endpoint data handling before use</text>
</svg>
